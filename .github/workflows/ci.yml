name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NODE_VERSION: "24"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Show SDK version
        run: dotnet --version

      - name: Restore dependencies
        run: dotnet restore InvoiceFlow.slnx

      - name: Build Release
        run: dotnet build InvoiceFlow.slnx --configuration Release --no-restore

      - name: Verify Docker for Testcontainers
        run: docker info

      - name: Run unit tests
        run: >
          dotnet test tests/InvoiceFlow.UnitTests/InvoiceFlow.UnitTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory artifacts/test-results/unit

      - name: Run integration tests
        run: >
          dotnet test tests/InvoiceFlow.IntegrationTests/InvoiceFlow.IntegrationTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory artifacts/test-results/integration

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 7

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build --target final --tag invoiceflow-api:ci .

      - name: Build migration image
        run: docker build --target migrator --tag invoiceflow-migrator:ci .

      - name: Build web image
        run: docker build --tag invoiceflow-web:ci frontend

      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-placeholder-password
          Jwt__SigningKey: ci-placeholder-signing-key-at-least-32-bytes-long
        run: docker compose config --quiet

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run unit and component tests
        run: npm run test

      - name: Build production bundle
        run: npm run build

  e2e:
    name: Full-stack E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-and-test, frontend-quality, docker-build]
    env:
      ASPNETCORE_ENVIRONMENT: Production
      POSTGRES_DB: invoiceflow_e2e
      POSTGRES_USER: invoiceflow_e2e
      POSTGRES_PASSWORD: ci-e2e-postgres-password
      Jwt__SigningKey: ci-e2e-signing-key-at-least-32-bytes-long
      Jwt__Issuer: InvoiceFlow
      Jwt__Audience: InvoiceFlow.Api
      LOGIN_PERMIT_LIMIT: "100"
      REGISTER_PERMIT_LIMIT: "100"
      E2E_BASE_URL: http://127.0.0.1:8081

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start isolated full stack
        run: docker compose --profile web up --detach --build --wait

      - name: Verify proxied readiness
        run: curl --fail --show-error --silent http://127.0.0.1:8081/health

      - name: Run browser E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop isolated full stack
        if: always()
        run: docker compose --profile web down --volumes --remove-orphans
