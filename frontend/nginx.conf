server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/security-headers.conf;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        # Browser requests are same-origin at this boundary. Strip the public Origin
        # before the private hop so backend CORS remains reserved for direct clients.
        proxy_set_header Origin "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /health {
        proxy_pass http://api:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /health/live {
        proxy_pass http://api:8080/health/live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
        include /etc/nginx/security-headers.conf;
    }
}
